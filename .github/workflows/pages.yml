# Publica el dashboard de la Tarea 3 (tarea_3/web) en GitHub Pages.
# Requisito único: Settings → Pages → Build and deployment → Source: «GitHub Actions».
name: Dashboard en GitHub Pages

on:
  push:
    branches: [main]
    paths: ["tarea_3/web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tarea_3/web
      - id: deployment
        uses: actions/deploy-pages@v4
